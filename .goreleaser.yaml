# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.1/www/docs/static/schema.json
version: 2

project_name: distship

builds:
  - id: distship
    main: .
    binary: distship
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/sperains/distship/cmd.version={{ .Version }}
        -X github.com/sperains/distship/cmd.commit={{ .FullCommit }}
        -X github.com/sperains/distship/cmd.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: distship
    ids:
      - distship
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}Darwin{{ else if eq .Os "linux" }}Linux{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - docs/*.md
      - docs/assets/*.png
      - skills/install-distship/**

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '

homebrew_casks:
  - name: distship
    ids:
      - distship
    binaries:
      - distship
    repository:
      owner: sperains
      name: homebrew-tap
      git:
        url: ssh://git@github.com/sperains/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    homepage: https://github.com/sperains/distship
    description: Deploy static frontend artifacts to SSH servers with confidence
    license: MIT
    skip_upload: auto

release:
  github:
    owner: sperains
    name: distship
  draft: false
  prerelease: auto
